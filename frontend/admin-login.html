<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | CodeAlpha Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="admin-login-page">
    <main>

        <div class="auth-container">

            <h2>
                Admin Login 🔐
            </h2>

            <form id="admin-login-form">

                <label>
                    Admin Email
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Enter admin email"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter admin password"
                    required
                >

                <button
                    type="submit"
                    class="checkout-btn"
                >
                    Login as Admin
                </button>

            </form>

        </div>

    </main>


    <script>

        document
            .getElementById("admin-login-form")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    const email =
                        document.getElementById(
                            "admin-email"
                        ).value;

                    const password =
                        document.getElementById(
                            "admin-password"
                        ).value;

                    try {

                        const response =
                            await fetch(
                                "/api/admin/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email,
                                            password
                                        })
                                }
                            );

                        const data =
                            await response.json();

                        if (response.ok) {

                            localStorage.setItem(
                                "admin",
                                "true"
                            );

                            window.location.href =
                                "admin.html";

                        } else {

                            alert(
                                data.message ||
                                "Invalid admin credentials"
                            );

                        }

                    } catch (error) {

                        console.error(error);

                        alert(
                            "Unable to connect to server."
                        );

                    }

                }
            );

    </script>

</body>

</html>
