<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | CodeAlpha Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>
            CodeAlpha Store 🛍️
        </h1>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products-section">
                Products
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

            <a
                href="auth.html"
                id="account-link"
            >
                Login 🔐
            </a>

        </nav>

    </header>



    <!-- =========================
         CART
    ========================== -->

    <main>

        <h2>
            Your Shopping Cart 🛒
        </h2>


        <div id="cart-container">

        </div>



        <!-- =========================
             ORDER SUMMARY
        ========================== -->

        <section class="cart-summary">

            <h2>
                Order Summary
            </h2>


            <p>
                Subtotal:
                <strong id="subtotal">
                    ₹0
                </strong>
            </p>


            <p>
                Shipping:
                <strong id="shipping">
                    FREE
                </strong>
            </p>


            <hr>


            <p class="total">

                Total:
                <strong id="total">
                    ₹0
                </strong>

            </p>


            <button
                class="checkout-btn"
                onclick="checkout()"
            >
                Proceed to Checkout →
            </button>

        </section>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 CodeAlpha E-Commerce Store
        </p>

    </footer>



    <!-- MAIN JAVASCRIPT -->

    <script src="script.js"></script>



    <!-- =========================
         ACCOUNT STATUS
    ========================== -->

    <script>

        const user =
            JSON.parse(
                localStorage.getItem("user")
            );


        const accountLink =
            document.getElementById(
                "account-link"
            );


        if (user) {

            accountLink.textContent =
                "👤 " + user.name + " | Logout";

            accountLink.href = "#";


            accountLink.onclick =
                function () {

                    localStorage.removeItem(
                        "user"
                    );

                    localStorage.removeItem(
                        "guestMode"
                    );

                    alert(
                        "You have been logged out successfully! 👋"
                    );

                    window.location.href =
                        "index.html";

                };

        }

    </script>


</body>

</html>
