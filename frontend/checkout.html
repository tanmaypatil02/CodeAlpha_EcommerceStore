<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | CodeAlpha Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header>

    <div class="logo">
        CodeAlpha Store
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

    </nav>

</header>



<!-- ==================================================
     CHECKOUT
================================================== -->

<main class="checkout-page">


    <div class="checkout-container">


        <!-- ==========================================
             DELIVERY DETAILS
        =========================================== -->

        <section class="checkout-form">

            <h1>
                Checkout 🛍️
            </h1>


            <p class="checkout-subtitle">
                Enter your delivery details
            </p>


            <form id="checkout-form">


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>



                <!-- Address -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your complete address"
                        rows="3"
                        required
                    ></textarea>

                </div>



                <!-- City -->

                <div class="form-group">

                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >

                </div>



                <!-- Pincode -->

                <div class="form-group">

                    <label for="pincode">
                        Pincode
                    </label>

                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter your pincode"
                        required
                    >

                </div>



                <!-- ======================================
                     PAYMENT METHOD
                ======================================= -->

                <div class="payment-section">

                    <h3>
                        Payment Method 💳
                    </h3>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment-method"
                            value="UPI"
                            required
                        >

                        <span>
                            📱 UPI
                        </span>

                    </label>



                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment-method"
                            value="Card"
                        >

                        <span>
                            💳 Credit / Debit Card
                        </span>

                    </label>



                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment-method"
                            value="Cash on Delivery"
                        >

                        <span>
                            💵 Cash on Delivery
                        </span>

                    </label>


                    <p class="payment-note">

                        🔒 Payment is simulated for this
                        demonstration project.

                    </p>

                </div>



                <!-- ======================================
                     PLACE ORDER
                ======================================= -->

                <button
                    type="submit"
                    class="checkout-btn"
                >

                    Place Order 🎉

                </button>


            </form>

        </section>



        <!-- ==========================================
             ORDER SUMMARY
        =========================================== -->

        <section class="order-summary">

            <h2>
                Order Summary
            </h2>


            <div id="checkout-items">
                Loading cart...
            </div>


            <div class="summary-total">

                <span>
                    Total
                </span>

                <strong id="checkout-total">
                    ₹0
                </strong>

            </div>

        </section>


    </div>

</main>



<!-- ==================================================
     SCRIPT
================================================== -->

<script>


// =====================================================
// GET USER
// =====================================================

const user =
    JSON.parse(
        localStorage.getItem("user")
    );


// =====================================================
// CHECK LOGIN
// =====================================================

if (!user) {

    alert(
        "Please login before checkout."
    );

    window.location.href =
        "auth.html?redirect=checkout";

}



// =====================================================
// GET CART
// =====================================================

const cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


// =====================================================
// CHECK CART
// =====================================================

if (cart.length === 0) {

    alert(
        "Your cart is empty."
    );

    window.location.href =
        "cart.html";

}



// =====================================================
// DISPLAY ORDER SUMMARY
// =====================================================

const checkoutItems =
    document.getElementById(
        "checkout-items"
    );

const checkoutTotal =
    document.getElementById(
        "checkout-total"
    );


let total = 0;


checkoutItems.innerHTML = "";


cart.forEach(item => {

    const itemTotal =
        Number(item.price) *
        Number(item.quantity);


    total += itemTotal;


    const itemElement =
        document.createElement("div");


    itemElement.className =
        "checkout-item";


    itemElement.innerHTML = `

        <div>

            <strong>
                ${item.name}
            </strong>

            <p>
                Quantity: ${item.quantity}
            </p>

        </div>


        <span>
            ₹${itemTotal}
        </span>

    `;


    checkoutItems.appendChild(
        itemElement
    );

});


checkoutTotal.textContent =
    `₹${total.toFixed(2)}`;



// =====================================================
// CHECKOUT FORM
// =====================================================

const checkoutForm =
    document.getElementById(
        "checkout-form"
    );


checkoutForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // =============================================
        // GET FORM VALUES
        // =============================================

        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const address =
            document.getElementById(
                "address"
            ).value.trim();


        const city =
            document.getElementById(
                "city"
            ).value.trim();


        const pincode =
            document.getElementById(
                "pincode"
            ).value.trim();


        const paymentMethod =
            document.querySelector(
                'input[name="payment-method"]:checked'
            )?.value;



        // =============================================
        // PAYMENT VALIDATION
        // =============================================

        if (!paymentMethod) {

            alert(
                "Please select a payment method."
            );

            return;

        }



        // =============================================
        // BASIC VALIDATION
        // =============================================

        if (
            !name ||
            !phone ||
            !address ||
            !city ||
            !pincode
        ) {

            alert(
                "Please fill all delivery details."
            );

            return;

        }



        // =============================================
        // DISABLE BUTTON
        // =============================================

        const button =
            checkoutForm.querySelector(
                "button[type='submit']"
            );


        button.disabled = true;

        button.textContent =
            "Processing Order...";



        try {

            // =========================================
            // SEND ORDER TO SERVER
            // =========================================

            const response =
                await fetch(
                    "/api/orders",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                userId:
                                    user.id,

                                total:
                                    total,

                                phone:
                                    phone,

                                address:
                                    address,

                                city:
                                    city,

                                pincode:
                                    pincode,

                                paymentMethod:
                                    paymentMethod,

                                items:
                                    cart

                            })

                    }
                );



            const data =
                await response.json();



            // =========================================
            // HANDLE ERROR
            // =========================================

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to place order"
                );

            }



            // =========================================
            // SUCCESS
            // =========================================

            if (
                paymentMethod === "UPI" ||
                paymentMethod === "Card"
            ) {

                alert(
                    `Order placed successfully! 🎉\n\n` +
                    `Payment method: ${paymentMethod}\n` +
                    `Payment simulated successfully.`
                );

            } else {

                alert(
                    `Order placed successfully! 🎉\n\n` +
                    `Payment method: Cash on Delivery`
                );

            }



            // =========================================
            // CLEAR CART
            // =========================================

            localStorage.removeItem(
                "cart"
            );


            localStorage.removeItem(
                "checkoutPending"
            );



            // =========================================
            // GO HOME
            // =========================================

            window.location.href =
                "index.html";


        } catch (error) {

            console.error(
                "Checkout error:",
                error
            );


            alert(
                error.message ||
                "Something went wrong while placing your order."
            );


            // Re-enable button

            button.disabled = false;

            button.textContent =
                "Place Order 🎉";

        }

    }
);

</script>


</body>

</html>
